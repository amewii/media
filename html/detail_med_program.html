<!-- Page Headings Start -->
<div class="row justify-content-between align-items-center mb-10">

    <!-- Page Heading Start -->
    <div class="col-12 col-lg-auto mb-20 ml-3">
        <div class="page-heading">
            <div class="row">
                <a id="back"><i class="ti-arrow-left" style="margin-left: 10px; margin-right: 10px; margin-top: 5px;"></i></a> <h3 class="title">Media <span>/ Program</span></h3>
            </div>
        </div>
    </div><!-- Page Heading End -->
    <!-- Page Heading Start -->
    <div class="col-12 col-lg-auto mb-20">
    </div><!-- Page Heading End -->

</div><!-- Page Headings End -->

<div class="row">
<!--Accordion Color (Cards) Start-->
    <div class="col-lg-3 col-12 mb-30">
        <div class="box">
            <div class="box-head">
                <h4 class="title"><span id="disp_nama_program"></span></h4>
            </div>
            <div class="box-body">
                <!--Accordion Start-->
                <div class="accordion accordion-icon primary" id="accordionExampleFour">

                    <!--Card Start-->
                    <div class="card secondary">

                        <!--Card Header Start-->
                        <div class="card-header">
                            <h2><button type="button">Butiran Program</button></h2>
                        </div>
                        <!--Card Header End-->

                        <!--Collapse Start-->
                        <div id="collapse4One" class="collapse show" data-parent="#accordionExampleFour">
                            <div class="card-body">
                                <!--Billing Info Start-->
                                <div class="col-lg-12 col-md-12 col-12 mb-20">
                                    <h6 class="mb-10">Tarikh Program</h6>
                                    <ul style="padding-left: 10px;">
                                        <input id="disp_id" class="hidden">
                                        <span id="disp_tarikh_program"></span>
                                    </ul>
                                    <h6 class="mb-10">Kampus</h6>
                                    <ul style="padding-left: 10px;">
                                        <span id="disp_nama_kampus"></span>
                                    </ul>
                                    <h6 class="mb-10">Program/Pusat</h6>
                                    <ul style="padding-left: 10px;">
                                        <span id="disp_nama_kluster"></span>
                                    </ul>
                                    <h6 class="mb-10 hidden">Unit</h6>
                                    <ul style="padding-left: 10px; display: none;">
                                        <span id="disp_nama_unit"></span>
                                    </ul>
                                    <h6 class="mb-10">Senarai VIP</h6>
                                    <ul style="padding-left: 10px;">
                                        <span id="disp_vip"></span>
                                    </ul>
                                </div>
                                <!--Billing Info End-->
                            </div>
                        </div>
                        <!--Collapse End-->

                    </div>
                    <!--Card End-->

                    <!--Card Start-->
                    <div class="card success">

                        <!--Card Header Start-->
                        <div class="card-header">
                            <h2><button class="collapsed show">Kategori Program</button></h2>
                        </div>
                        <!--Card Header End-->

                        <!--Collapse Start-->
                        <div id="collapse4Two" class="collapse show" data-parent="#accordionExampleFour">
                            <div class="card-body">                            
                                <!--Billing Info Start-->
                                <div class="col-lg-12 col-md-12 col-12 mb-20">
                                    <h6 class="mb-10">Kategori</h6>
                                    <ul style="padding-left: 10px;">
                                        <span id="disp_nama_kategori"></span>
                                    </ul>
                                    <h6 class="mb-10">Bilangan Fail</h6>
                                    <ul style="padding-left: 10px;">
                                        <span id="disp_bilangan_fail"></span>
                                    </ul>
                                    <h6 class="mb-10">Format</h6>
                                    <ul style="padding-left: 10px;">
                                        <span id="disp_kod_format"></span>
                                    </ul>
                                    <h6 class="mb-10">Saiz Folder</h6>
                                    <ul style="padding-left: 10px;">
                                        <span id="disp_saiz_fail"></span> MB
                                    </ul>
                                </div>
                                <!--Billing Info End-->
                            </div>
                        </div>
                        <!--Collapse End-->

                    </div>
                    <!--Card End-->

                </div>
                <!--Accordion End-->
            </div>
        </div>
    </div>
    <!--Accordion Color (Cards) End-->

    <div class="box-body hidden" id="spinner">
        <div class="spinner-border">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!--With Indicators Start-->
    <div class="col-lg-9 col-12 mb-30">
        <div class="box">
            <div class="box-head">
                <!-- Page Heading Start -->
                <div class="col-12 col-lg-auto">
                    <div class="page-heading">
                        <div class="row">
                            <h4 class="title">Senarai Media</h4>
                        </div>
                    </div>
                </div><!-- Page Heading End -->
            </div>
            <div class="box-body">
                <div class="media-library-toolbar">
                    <div class="media-selection-tools">
                        <label class="media-select-all" for="checkAll">
                            <input type="checkbox" id="checkAll">
                            <span>Pilih semua</span>
                        </label>
                        <span class="media-selected-count" id="mediaSelectedCount">0 dipilih</span>
                    </div>

                    <div class="media-view-switcher" role="group" aria-label="Pilihan paparan media">
                        <button type="button" class="media-view-button" data-media-view="list" aria-pressed="false" title="Paparan senarai">
                            <i class="ti-view-list"></i><span>Senarai</span>
                        </button>
                        <button type="button" class="media-view-button active" data-media-view="thumbnail" aria-pressed="true" title="Paparan thumbnail">
                            <i class="ti-view-grid"></i><span>Thumbnail</span>
                        </button>
                        <button type="button" class="media-view-button" data-media-view="filmstrip" aria-pressed="false" title="Paparan pratonton">
                            <i class="ti-layout-slider-alt"></i><span>Pratonton</span>
                        </button>
                    </div>

                    <div class="media-library-actions">
                        <button class="button button-sm button-primary hidden control_program_media_U2" data-toggle="modal" data-target="#reg-media"><span><i class="ti-plus"></i>Muat naik</span></button>
                        <button type="button" class="button button-sm button-danger" id="hapusgambar" onclick="del_media_multiple()"><i class="fa fa-trash"></i> Hapus</button>
                        <a class="button button-sm button-success hidden control_program_media_U2" href="javascript:void(0);" onclick="publish();"><span><i class="ti-share"></i>Siar</span></a>
                        <a class="button button-sm button-danger hidden control_program_media_U2" href="javascript:void(0);" onclick="batal_publish();"><span><i class="ti-close"></i>Batal siar</span></a>
                    </div>
                </div>

                <input type="text" id="uptid" class="hidden">
                <textarea id="dataList" class="hidden"></textarea>

                <div class="media-main-preview hidden" id="mediaPreviewPanel" aria-live="polite">
                    <div class="media-main-preview-stage" id="mediaPreviewStage"></div>
                    <div class="media-main-preview-details">
                        <div>
                            <span class="media-preview-label">Pratonton media</span>
                            <strong id="mediaPreviewName">Pilih media untuk dipratonton</strong>
                        </div>
                        <button type="button" class="button button-sm button-primary" id="mediaPreviewOpen" disabled>
                            <i class="ti-new-window"></i>Buka media
                        </button>
                    </div>
                </div>

                <div class="media-gallery media-view-thumbnail" id="listImages">
                </div>
            </div>
        </div>
    </div>
    <!--With Indicators End-->

    <div class="modal fade" id="tag-gambar" data-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <form role="form" id="taggambar" enctype='multipart/form-data'>
                    <div class="modal-header">
                        <h5 class="modal-title">Kemaskini Fail Media</h5><hr/>
                    </div>
                    <div class="modal-body">                        
                        <div class="col-12 mb-20">
                            <div class="watermark">
                                <div id="imgTags" class="text-center"></div>
                            </div>
                            <h4>
                                <label for="listvip" class="mt-2">Tag VIP</label>
                            </h4>
                            <label for="listvip" class="mt-10">Carian Nama VIP</label>
                            <input list="FK_userss" id="listvip" class="form-control">
                            <datalist id="FK_userss"></datalist>
                            
                            <textarea class="form-control mt-2" id="FK_users" placeholder="Senarai VIP"></textarea>
                            <input type="text" id="FK_user" class="hidden">
                            <input type="text" id="imgText" class="hidden">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="button button-success" type="submit"> Ya </button>
                        <button type="button" class="button button-primary" onclick="del_media()">Hapus</button>
                        <button class="button button-danger" data-dismiss="modal" onclick="resetForm();" id="closeButton"><i class="ti-close"></i>Tutup</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade media-upload-modal" id="reg-media" data-backdrop="static">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form role="form" id="register" enctype='multipart/form-data'>
                    <div class="modal-header">
                        <h5 class="modal-title">Muat Naik Fail Baharu</h5>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12">
                                <!-- <label for="nama_program">Nama Program</label> -->
                                <!--FilePond Start-->
                                <input class="form-control hidden" id="upt_id" type="text">
                                <input type="file" id="upload-2" multiple>
                                <!--FilePond End-->
                                <div id="upload-2-queue"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button onclick="$.fileup('upload-2', 'upload', '*')" class="button button-success" type="button">Muat naik semua</button>
                        <button onclick="$.fileup('upload-2', 'remove', '*')" class="button button-danger" type="button">Padam semua</button>
                        <button class="button button-danger" data-dismiss="modal" id="finishButton"><i class="ti-close"></i>Tutup</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="loading_modal" data-backdrop="static">
        <div class="modal-dialog">
          <div style="padding-top: 50%;" class="text-center text-white"><span class="fa fa-cog fa-spin fa-3x m-b"></span><br><i>Loading...</i></div>
        </div>
    </div>

</div>
